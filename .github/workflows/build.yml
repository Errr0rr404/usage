name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: usage-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          expected="Usage-${version}-mac-arm64.dmg Usage-${version}-mac-x64.dmg Usage-${version}-mac-arm64.zip Usage-${version}-mac-x64.zip Usage-${version}-win-x64.exe Usage-${version}-win-ia32.exe"
          missing=""
          for name in $expected; do
            if [ ! -f "release-assets/${name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing release files:${missing}"
            find release-assets -type f -print
            exit 1
          fi
          notes=$(cat <<EOF
          Install the file that matches your computer.

          - Mac with Apple silicon: \`Usage-${version}-mac-arm64.dmg\`
          - Mac with Intel: \`Usage-${version}-mac-x64.dmg\`
          - Windows 64-bit: \`Usage-${version}-win-x64.exe\`
          - Windows 32-bit: \`Usage-${version}-win-ia32.exe\`

          The zip files are the same Mac apps without a disk image.

          These builds are not signed. On a Mac, Control-click Usage the first time and choose Open. On Windows, if SmartScreen appears, choose More info, then Run anyway.
          EOF
          )
          notes=$(printf '%s\n' "$notes" | sed 's/^          //')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/Usage-${version}-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/Usage-${version}-* \
              --title "Usage ${version}" \
              --notes "$notes"
          fi
